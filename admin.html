<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4ebdc"><title>Administração | Arena Beach Park</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><style>
:root{--bg:#f4ebdc;--ink:#1b4052;--accent:#b75b27;--line:#e7dac6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.head,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:24px;margin:0}h2{font-size:18px;margin:0 0 14px}button,input,select{font:inherit;padding:10px;border:1px solid var(--line);border-radius:9px}button{background:var(--accent);color:white;border:0;cursor:pointer;font-weight:700}.secondary{background:#e8eee9;color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:5px}.field label{font-size:12px;font-weight:700}.field input,.field select{width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hidden{display:none!important}.status{color:#637078;font-size:13px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:11px;border-bottom:1px solid #eee;font-size:13px}td button{padding:7px 9px}.order{border:1px solid var(--line);border-radius:12px;padding:12px;margin:9px 0}.order small{color:#667}.tag{display:inline-block;padding:4px 8px;border-radius:20px;background:#e9eee9;font-size:11px}@media(max-width:650px){.wrap{padding:12px}.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}
.admin-nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;background:#fff;padding:12px;border:1px solid var(--line);border-radius:16px}.admin-nav button{background:#e8eee9;color:var(--ink);flex:1;min-width:140px}.admin-nav button[aria-selected="true"]{background:var(--ink);color:#fff}.admin-nav #logout{flex:0;min-width:70px;background:#f4ebdc}@media(max-width:650px){.admin-nav button{min-width:120px}}
</style></head><body><main class="wrap"><header class="head"><div><h1>Arena Beach Park · Administração</h1><p class="status">Produtos, preços e pedidos</p></div><a href="./index.html">Voltar ao cardápio</a></header>
<section class="panel" id="login"><h2>Acesso administrativo</h2><div class="grid"><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password"></div></div><div class="actions"><button id="loginBtn">Entrar</button></div><p class="status" id="loginStatus">Use um usuário criado no Supabase Auth e autorizado na tabela admin_users.</p></section>
<div id="app" class="hidden"><nav class="admin-nav" aria-label="Menu administrativo"><button type="button" data-view="ordersPanel" aria-selected="true">Pedidos recentes</button><button type="button" data-view="registerPanel" aria-selected="false">Cadastro de produto</button><button type="button" data-view="productsPanel" aria-selected="false">Produtos cadastrados</button><button type="button" id="logout">Sair</button></nav><section class="panel hidden" id="registerPanel"><h2>Cadastro de produto</h2><input id="productId" type="hidden"><div class="grid"><div class="field"><label>Nome</label><input id="name"></div><div class="field"><label>Categoria</label><select id="category"><option>Petiscos</option><option>Espetos</option><option>Drinks e cervejas</option><option>Hidratação e energia</option><option>Refrigerantes</option></select></div><div class="field"><label>Preços (separados por vírgula)</label><input id="prices" placeholder="30.00,22.50"></div><div class="field"><label>Opções (separadas por vírgula)</label><input id="options" placeholder="Completa,Meia porção"></div><div class="field"><label>Ícone / emoji</label><input id="icon" value="•"></div><div class="field"><label>Ordem</label><input id="sort" type="number" value="100"></div></div><label style="display:block;margin-top:12px"><input id="active" type="checkbox" checked> Produto disponível</label><div class="actions"><button id="saveProduct">Salvar produto</button><button class="secondary" id="clearForm">Limpar</button></div><p id="productStatus" class="status"></p></section>
<section class="panel hidden" id="productsPanel"><h2>Produtos cadastrados</h2><div class="tablewrap"><table><thead><tr><th>Produto</th><th>Categoria</th><th>Preço(s)</th><th>Status</th><th>Ação</th></tr></thead><tbody id="productRows"></tbody></table></div></section>
<section class="panel" id="ordersPanel"><h2>Pedidos recentes</h2><div id="orders"></div></section></div></main>
<script>
(()=>{'use strict';const c=window.ARENA_CONFIG||{},ready=/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(c.SUPABASE_URL||'')&&c.SUPABASE_ANON_KEY&&!String(c.SUPABASE_ANON_KEY).includes('SUA_CHAVE');const db=ready&&window.supabase?window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY):null;const $=id=>document.getElementById(id);let products=[];function showView(id){document.querySelectorAll("#app > section").forEach(el=>el.classList.toggle("hidden",el.id!==id));document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.view===id)))}document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>showView(b.dataset.view));if(!db){$('loginStatus').textContent='Configure config.js com URL e chave pública do Supabase para habilitar o painel.';$('loginBtn').disabled=true;return}
async function auth(){const {data:{session}}=await db.auth.getSession();$('login').classList.toggle('hidden',!!session);$('app').classList.toggle('hidden',!session);if(session){const {data,error}=await db.from('admin_users').select('user_id').eq('user_id',session.user.id).maybeSingle();if(error||!data){await db.auth.signOut();$('loginStatus').textContent='Usuário autenticado, mas sem permissão administrativa.';$('login').classList.remove('hidden');$('app').classList.add('hidden');return}showView("ordersPanel");loadAll()}}
$('loginBtn').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('loginStatus').textContent=error?error.message:'Acesso validado.';if(!error)auth()};$('logout').onclick=async()=>{await db.auth.signOut();auth()};
function clear(){['productId','name','prices','options'].forEach(x=>$(x).value='');$('icon').value='•';$('sort').value='100';$('active').checked=true}
$('clearForm').onclick=clear;$('saveProduct').onclick=async()=>{const name=$('name').value.trim(),prices=$('prices').value.split(',').map(x=>Number(x.trim())).filter(Number.isFinite),options=$('options').value.split(',').map(x=>x.trim()).filter(Boolean);if(!name||!prices.length){$('productStatus').textContent='Informe nome e pelo menos um preço válido.';return}if(options.length&&options.length!==prices.length){$('productStatus').textContent='A quantidade de opções deve corresponder à quantidade de preços.';return}const row={name,category:$('category').value,prices,options,icon:$('icon').value||'•',sort_order:Number($('sort').value)||100,active:$('active').checked};const id=$('productId').value;const result=id?await db.from('products').update(row).eq('id',id):await db.from('products').insert(row);$('productStatus').textContent=result.error?result.error.message:'Produto salvo.';if(!result.error){clear();loadProducts()}};
async function loadProducts(){const {data,error}=await db.from('products').select('*').order('sort_order');if(error){$('productStatus').textContent=error.message;return}products=data||[];$('productRows').replaceChildren();products.forEach(p=>{const tr=document.createElement('tr');[p.name,p.category,(p.prices||[]).map(v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})).join(' / '),p.active?'Disponível':'Indisponível'].forEach(t=>{const td=document.createElement('td');td.textContent=t;tr.append(td)});const td=document.createElement('td'),b=document.createElement('button');b.textContent='Editar';b.onclick=()=>{ $('productId').value=p.id;$('name').value=p.name;$('category').value=p.category;$('prices').value=(p.prices||[]).join(',');$('options').value=(p.options||[]).join(',');$('icon').value=p.icon||'•';$('sort').value=p.sort_order||100;$('active').checked=p.active;showView('registerPanel')};td.append(b);tr.append(td);$('productRows').append(tr)})}
async function loadOrders(){const {data,error}=await db.from('orders').select('*').order('created_at',{ascending:false}).limit(50);if(error){$('orders').textContent=error.message;return}$('orders').replaceChildren();if(!data?.length){$('orders').textContent='Nenhum pedido registrado.';return}(data||[]).forEach(o=>{const box=document.createElement('article');box.className='order';const title=document.createElement('strong');title.textContent=`Pedido ${o.order_number||o.id} · ${o.customer_name}`;const info=document.createElement('p');info.textContent=`${o.location_label||'Sem mesa/quadra'} · ${Number(o.total).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})} · ${new Date(o.created_at).toLocaleString('pt-BR')}`;const status=document.createElement('select');['received','preparing','ready','delivered','cancelled'].forEach(s=>{const op=document.createElement('option');op.value=s;op.textContent=({received:'Recebido',preparing:'Preparando',ready:'Pronto',delivered:'Entregue',cancelled:'Cancelado'})[s];op.selected=o.status===s;status.append(op)});status.onchange=async()=>{const {error}=await db.from('orders').update({status:status.value}).eq('id',o.id);if(error)alert(error.message)};const list=document.createElement('p');list.textContent=(o.items||[]).map(i=>`${i.quantity}x ${i.name}${i.option?' ('+i.option+')':''}`).join(' · ');box.append(title,info,list,status);$('orders').append(box)})}
async function loadAll(){await Promise.all([loadProducts(),loadOrders()]);db.channel('admin-orders').on('postgres_changes',{event:'*',schema:'public',table:'orders'},loadOrders).subscribe();db.channel('admin-products').on('postgres_changes',{event:'*',schema:'public',table:'products'},loadProducts).subscribe()}auth();
})();
</script></body></html>
